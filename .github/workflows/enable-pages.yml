name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The cloud-agent GitHub App token cannot administer Pages.
# The Actions token can request pages: write, which is enough to
# configure a site that deploys from the repository root.
permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main /
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: https://api.github.com/repos/${{ github.repository }}/pages
        run: |
          set -euo pipefail
          hdr=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json")
          create='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          update='{"build_type":"legacy","source":{"branch":"main","path":"/"},"https_enforced":true}'
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST "${hdr[@]}" "$API" -d "$create" || true)
          echo "POST ${code}"
          cat /tmp/pages.json
          echo
          if [ "$code" = "201" ] || [ "$code" = "409" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT "${hdr[@]}" "$API" -d "$update" || true)
            echo "PUT ${code}"
            cat /tmp/pages.json
            echo
          fi
          case "$code" in
            200|201) ;;
            *) exit 1 ;;
          esac
